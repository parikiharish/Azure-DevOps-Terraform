trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:


- bash: |
    set -e

    TERRAFORM_VERSION="1.9.8"
    TMP_DIR="$(mktemp -d)"

    echo "Installing Terraform ${TERRAFORM_VERSION}..."
    echo "Temporary directory: ${TMP_DIR}"

    curl -fsSL \
      "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
      -o "${TMP_DIR}/terraform.zip"

    unzip -o "${TMP_DIR}/terraform.zip" -d "${TMP_DIR}"

    sudo install -m 0755 "${TMP_DIR}/terraform" /usr/local/bin/terraform

    rm -rf "${TMP_DIR}"

    echo "Terraform installation completed."

    terraform version

  displayName: 'Install Terraform'

- task: AzureCLI@2
  displayName: 'Test Azure OIDC Authentication'
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      echo "Service Principal ID is available: ${servicePrincipalId:+YES}"
      echo "Tenant ID is available: ${tenantId:+YES}"
      echo "OIDC token is available: ${idToken:+YES}"

       az account show --query '{subscription:id, tenant:tenantId}' -o table

- bash: |
    terraform fmt -check -recursive
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  displayName: 'Terraform Format Check'

- bash: |
    terraform validate
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  displayName: 'Terraform Validate'

- bash: |
    terraform plan -out=tfplan
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  displayName: 'Terraform Plan'