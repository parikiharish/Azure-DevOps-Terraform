trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:


- bash: |
    set -e

    TERRAFORM_VERSION="1.9.8"
    TMP_DIR="$(mktemp -d)"

    echo "Installing Terraform ${TERRAFORM_VERSION}..."
    echo "Temporary directory: ${TMP_DIR}"

    curl -fsSL \
      "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
      -o "${TMP_DIR}/terraform.zip"

    unzip -o "${TMP_DIR}/terraform.zip" -d "${TMP_DIR}"

    sudo install -m 0755 "${TMP_DIR}/terraform" /usr/local/bin/terraform

    rm -rf "${TMP_DIR}"

    echo "Terraform installation completed."

    terraform version

  displayName: 'Install Terraform'

- task: AzureCLI@2
  displayName: 'Terraform init'
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      set -e
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$subscriptionId"
      export ARM_OIDC_TOKEN="$id_token"

      #Remote State Backend OIDC Mapping
      export ARM_USE_AZUREAD=true
      export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
      export ARM_SKIP_PROVIDER_REGISTRATION=true

      terraform init

- bash: |
    terraform fmt -check -recursive
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  displayName: 'Terraform Format Check'

- bash: |
    terraform validate
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  displayName: 'Terraform Validate'

- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      set -e
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$subscriptionId"
      export ARM_OIDC_TOKEN="$id_token"

      # Remote State Backend OIDC Mapping
      export ARM_USE_AZUREAD=true
      export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

      terraform plan -out=tfplan