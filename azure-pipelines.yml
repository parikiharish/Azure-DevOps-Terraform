
trigger:
  - main

variables:
  terraformVersion: '1.9.8'
  azureServiceConnection: 'Azure-Terraform-OIDC'
  azureSubscriptionId: '366a76d8-1133-4884-9ea5-f88b5ceee805'

stages:

# ==========================================
# STAGE 1: TERRAFORM CI
# ==========================================
- stage: CI
  displayName: 'Terraform CI'

  jobs:
  - job: TerraformCI
    displayName: 'Terraform Validate and Plan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - bash: |
        set -e
        TERRAFORM_VERSION="$(terraformVersion)"
        TMP_DIR="$(mktemp -d)"

        curl -fsSL \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -o "${TMP_DIR}/terraform.zip"

        unzip -o "${TMP_DIR}/terraform.zip" -d "${TMP_DIR}"
        sudo install -m 0755 "${TMP_DIR}/terraform" /usr/local/bin/terraform
        rm -rf "${TMP_DIR}"

        terraform version
      displayName: 'Install Terraform'

    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate and Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(azureSubscriptionId)"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true

          mkdir -p "$(Build.ArtifactStagingDirectory)"

          terraform -chdir=terraform init \
            -input=false \
            -reconfigure

          terraform -chdir=terraform fmt -check -recursive

          terraform -chdir=terraform validate

          terraform -chdir=terraform plan \
            -input=false \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# ==========================================
# STAGE 2: TERRAFORM CD - REVIEW PLAN
# ==========================================
- stage: CD
  displayName: 'Terraform CD - Plan Review'
  dependsOn: CI
  condition: succeeded()

  jobs:
  - job: TerraformCD
    displayName: 'Review Terraform Plan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - bash: |
        set -e
        TERRAFORM_VERSION="$(terraformVersion)"
        TMP_DIR="$(mktemp -d)"

        curl -fsSL \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -o "${TMP_DIR}/terraform.zip"

        unzip -o "${TMP_DIR}/terraform.zip" -d "${TMP_DIR}"
        sudo install -m 0755 "${TMP_DIR}/terraform" /usr/local/bin/terraform
        rm -rf "${TMP_DIR}"

        terraform version
      displayName: 'Install Terraform'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Terraform Plan'
      inputs:
        artifact: 'terraform-plan'
        path: '$(Pipeline.Workspace)/terraform-plan'

    - bash: |
        set -e

        echo "Reviewing Terraform deployment plan..."

        terraform show -no-color \
          "$(Pipeline.Workspace)/terraform-plan/tfplan"
      displayName: 'Display Terraform Plan'


# ==========================================
# STAGE 3: MANUAL APPROVAL
# ==========================================
- stage: Approval
  displayName: 'Terraform Approval'
  dependsOn: CD
  condition: succeeded()

  jobs:
  - job: ManualApproval
    displayName: 'Waiting for Approval'
    pool: server

    timeoutInMinutes: 1500

    steps:
    - task: ManualValidation@1
      displayName: 'Approve Terraform Deployment'
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review the Terraform plan displayed in the CD stage.

          Approve only if the proposed infrastructure changes
          are correct and expected.

          Reject if unexpected changes or resource deletions appear.
        onTimeout: 'reject'


# ==========================================
# STAGE 4: TERRAFORM APPLY
# ==========================================
- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Approval
  condition: succeeded()

  jobs:
  - job: TerraformApply
    displayName: 'Deploy Azure Infrastructure'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - bash: |
        set -e
        TERRAFORM_VERSION="$(terraformVersion)"
        TMP_DIR="$(mktemp -d)"

        curl -fsSL \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          -o "${TMP_DIR}/terraform.zip"

        unzip -o "${TMP_DIR}/terraform.zip" -d "${TMP_DIR}"
        sudo install -m 0755 "${TMP_DIR}/terraform" /usr/local/bin/terraform
        rm -rf "${TMP_DIR}"

        terraform version
      displayName: 'Install Terraform'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Approved Terraform Plan'
      inputs:
        artifact: 'terraform-plan'
        path: '$(Pipeline.Workspace)/terraform-plan'

    - task: AzureCLI@2
      displayName: 'Terraform Init and Apply'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          set -euo pipefail

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(azureSubscriptionId)"
          export ARM_OIDC_TOKEN="$idToken"
          export ARM_USE_OIDC=true
          export ARM_USE_AZUREAD=true

          terraform -chdir=terraform init \
            -input=false \
            -reconfigure

          terraform -chdir=terraform apply \
            -input=false \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"